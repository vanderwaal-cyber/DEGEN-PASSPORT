<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Degen Passport</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" />
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --gold: #f5a623;
    --dark: #0d0d1a;
    --dark2: #1a1a2e;
    --dark3: #16213e;
    --text: #e8e6f0;
    --muted: rgba(232,230,240,0.5);
    --green: #1D9E75;
    --red: #E24B4A;
    --border: rgba(245,166,35,0.2);
  }
  body {
    background: var(--dark);
    color: var(--text);
    font-family: 'Syne', sans-serif;
    min-height: 100vh;
    display: flex;
    align-items: flex-start;
    justify-content: center;
    padding: 2rem 1rem 4rem;
  }
  .container { width: 100%; max-width: 560px; }
  .header { text-align: center; margin-bottom: 2.5rem; padding-top: 1rem; }
  .header h1 { font-size: 28px; font-weight: 700; letter-spacing: 3px; text-transform: uppercase; color: var(--gold); }
  .header p { font-size: 13px; color: var(--muted); margin-top: 6px; letter-spacing: 1px; }

  .setup-card { background: var(--dark2); border: 0.5px solid var(--border); border-radius: 16px; padding: 1.5rem; margin-bottom: 1.5rem; }
  .field-label { font-size: 10px; letter-spacing: 2px; text-transform: uppercase; color: var(--gold); margin-bottom: 8px; display: block; }
  input {
    width: 100%; background: rgba(255,255,255,0.05); border: 0.5px solid var(--border);
    border-radius: 10px; padding: 12px 16px; font-size: 14px; color: var(--text);
    font-family: 'Syne', sans-serif; outline: none; transition: border-color 0.2s; margin-bottom: 14px;
  }
  input:focus { border-color: var(--gold); }
  input::placeholder { color: var(--muted); }
  .divider { border: none; border-top: 0.5px solid var(--border); margin: 16px 0; }
  .generate-btn {
    width: 100%; padding: 14px; background: var(--gold); border: none; border-radius: 10px;
    color: var(--dark); font-size: 15px; font-weight: 700; font-family: 'Syne', sans-serif;
    letter-spacing: 2px; text-transform: uppercase; cursor: pointer; transition: opacity 0.15s; margin-top: 4px;
  }
  .generate-btn:hover { opacity: 0.9; }
  .generate-btn:disabled { opacity: 0.5; cursor: not-allowed; }
  .note { font-size: 11px; color: var(--muted); margin-top: 10px; line-height: 1.6; }

  .loading { text-align: center; padding: 3rem; color: var(--muted); font-size: 13px; letter-spacing: 2px; text-transform: uppercase; animation: pulse 1.5s ease-in-out infinite; }
  @keyframes pulse { 0%,100% { opacity: 0.4; } 50% { opacity: 1; } }

  .error { background: rgba(226,75,74,0.1); border: 0.5px solid rgba(226,75,74,0.4); border-radius: 10px; padding: 14px 18px; font-size: 13px; color: #F09595; line-height: 1.6; }

  .passport { background: var(--dark2); border: 0.5px solid var(--border); border-radius: 16px; overflow: hidden; animation: slideUp 0.5s cubic-bezier(0.16,1,0.3,1); }
  @keyframes slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }

  .passport-header { background: linear-gradient(135deg, var(--dark3) 0%, var(--dark2) 100%); border-bottom: 1px solid var(--border); padding: 1.5rem; position: relative; overflow: hidden; }
  .passport-header::before { content: ''; position: absolute; top: -40px; right: -40px; width: 140px; height: 140px; border-radius: 50%; border: 1px solid rgba(245,166,35,0.1); }
  .passport-header::after { content: ''; position: absolute; top: -20px; right: -20px; width: 100px; height: 100px; border-radius: 50%; border: 1px solid rgba(245,166,35,0.08); }

  .header-top { display: flex; justify-content: space-between; align-items: flex-start; }
  .passport-eyebrow { font-size: 9px; letter-spacing: 3px; text-transform: uppercase; color: var(--gold); margin-bottom: 6px; }
  .passport-name { font-size: 22px; font-weight: 700; color: #fff; letter-spacing: 1px; }
  .passport-wallet { font-size: 11px; color: var(--muted); font-family: 'IBM Plex Mono', monospace; margin-top: 4px; }
  .rank-badge { background: rgba(245,166,35,0.12); border: 1px solid var(--gold); color: var(--gold); font-size: 11px; font-weight: 700; padding: 5px 12px; border-radius: 20px; letter-spacing: 1px; white-space: nowrap; flex-shrink: 0; }

  .passport-body { padding: 1.5rem; }
  .stats-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 1.5rem; }
  .stat-card { background: rgba(255,255,255,0.04); border: 0.5px solid rgba(245,166,35,0.1); border-radius: 10px; padding: 12px; text-align: center; }
  .stat-label { font-size: 10px; color: var(--muted); letter-spacing: 1px; text-transform: uppercase; margin-bottom: 6px; }
  .stat-value { font-size: 17px; font-weight: 700; color: var(--text); font-family: 'IBM Plex Mono', monospace; }
  .stat-value.green { color: var(--green); }
  .stat-value.red { color: var(--red); }
  .stat-value.amber { color: var(--gold); }

  .chains-section { margin-bottom: 1.5rem; }
  .chains-label { font-size: 10px; letter-spacing: 2px; text-transform: uppercase; color: var(--muted); margin-bottom: 10px; }
  .chains { display: flex; flex-wrap: wrap; gap: 6px; }
  .chain { font-size: 11px; font-weight: 500; padding: 4px 12px; border-radius: 20px; border: 1px solid; letter-spacing: 0.5px; }
  .chain.active { background: rgba(29,158,117,0.12); border-color: var(--green); color: #5DCAA5; }
  .chain.inactive { background: rgba(255,255,255,0.03); border-color: rgba(255,255,255,0.1); color: var(--muted); }

  .share-btn { width: 100%; padding: 13px; background: transparent; border: 1px solid var(--gold); border-radius: 10px; color: var(--gold); font-size: 13px; font-weight: 700; font-family: 'Syne', sans-serif; letter-spacing: 2px; text-transform: uppercase; cursor: pointer; transition: all 0.2s; }
  .share-btn:hover { background: var(--gold); color: var(--dark); }
</style>
</head>
<body>
<div class="container">
  <div class="header">
    <h1>Degen Passport</h1>
    <p>Your onchain identity card</p>
  </div>

  <div class="setup-card">
    <label class="field-label">Zerion API Key</label>
    <input type="password" id="apiKey" placeholder="Paste your Zerion API key" />
    <hr class="divider" />
    <label class="field-label">Wallet Address</label>
    <input type="text" id="walletInput" placeholder="0x..." />
    <label class="field-label">X Handle <span style="color:var(--muted);font-size:10px;">(optional)</span></label>
    <input type="text" id="xHandle" placeholder="e.g. 0x_degenola" />
    <button class="generate-btn" onclick="generatePassport()" id="genBtn">Generate Passport</button>
    <p class="note">Your API key stays in your browser — never logged or stored.</p>
  </div>

  <div id="output"></div>
</div>

<script>
const CHAIN_STAMPS = ["ethereum","solana","base","arbitrum","polygon","binance-smart-chain","avalanche","optimism"];
const CHAIN_LABELS = { "ethereum":"Ethereum","solana":"Solana","base":"Base","arbitrum":"Arbitrum","polygon":"Polygon","binance-smart-chain":"BSC","avalanche":"Avalanche","optimism":"Optimism" };
const RANKS = ["Ngmi","Paper Hands","Normie","Mid Degen","Full Degen","Gigachad"];

async function generatePassport() {
  const wallet = document.getElementById("walletInput").value.trim();
  const apiKey = document.getElementById("apiKey").value.trim();
  const handle = document.getElementById("xHandle").value.trim().replace(/^@/,"");
  const out = document.getElementById("output");
  const btn = document.getElementById("genBtn");

  if (!wallet || !apiKey) {
    out.innerHTML = `<div class="error">Please enter both your Zerion API key and a wallet address.</div>`;
    return;
  }

  btn.disabled = true;
  out.innerHTML = `<div class="loading">Scanning onchain history...</div>`;

  try {
    const headers = { "x-zerion-key": apiKey };

    const [portfolioRes, positionsRes, txRes] = await Promise.all([
      fetch(`/api/zerion/wallets/${wallet}/portfolio?currency=usd`, { headers }),
      fetch(`/api/zerion/wallets/${wallet}/positions/?filter[position_types]=wallet&currency=usd&page[size]=100`, { headers }),
      fetch(`/api/zerion/wallets/${wallet}/transactions/?currency=usd&page[size]=100`, { headers }),
    ]);

    if (!portfolioRes.ok) throw new Error("Invalid API key or wallet address. Check both and try again.");

    const [portfolio, positions, transactions] = await Promise.all([
      portfolioRes.json(), positionsRes.json(), txRes.json()
    ]);

    const totalValue = portfolio?.data?.attributes?.total?.positions || 0;
    const txList = transactions?.data || [];
    const txCount = txList.length;
    const chainSet = new Set((positions?.data || []).map(p => p?.relationships?.chain?.data?.id).filter(Boolean));
    const chainsVisited = CHAIN_STAMPS.filter(c => chainSet.has(c));

    let biggestW = 0, biggestL = 0;
    txList.forEach(tx => {
      (tx?.attributes?.transfers || []).forEach(t => {
        const val = parseFloat(t?.value || 0);
        if (val > 0 && val > biggestW) biggestW = val;
        if (val < 0 && Math.abs(val) > biggestL) biggestL = Math.abs(val);
      });
    });

    const firstTx = txList[txList.length - 1];
    const firstDate = firstTx?.attributes?.mined_at ? new Date(firstTx.attributes.mined_at) : null;
    const walletAge = firstDate ? Math.floor((Date.now() - firstDate.getTime()) / 86400000) : null;

    const rankIdx = Math.min(Math.floor(chainsVisited.length / 1.5 + txCount / 50), RANKS.length - 1);
    const rank = RANKS[rankIdx];
    const shortWallet = wallet.slice(0,6) + "..." + wallet.slice(-4);
    const displayName = handle ? "@" + handle : "Anon Degen";

    out.innerHTML = `
      <div class="passport">
        <div class="passport-header">
          <div class="header-top">
            <div>
              <div class="passport-eyebrow">Degen Passport — Onchain Identity</div>
              <div class="passport-name">${displayName}</div>
              <div class="passport-wallet">${shortWallet}</div>
            </div>
            <div class="rank-badge">${rank}</div>
          </div>
        </div>
        <div class="passport-body">
          <div class="stats-grid">
            <div class="stat-card"><div class="stat-label">Wallet age</div><div class="stat-value">${walletAge ? walletAge + "d" : "—"}</div></div>
            <div class="stat-card"><div class="stat-label">Portfolio</div><div class="stat-value green">$${Math.round(totalValue).toLocaleString()}</div></div>
            <div class="stat-card"><div class="stat-label">Transactions</div><div class="stat-value">${txCount}+</div></div>
            <div class="stat-card"><div class="stat-label">Biggest W</div><div class="stat-value green">${biggestW > 0 ? "$" + Math.round(biggestW).toLocaleString() : "—"}</div></div>
            <div class="stat-card"><div class="stat-label">Biggest L</div><div class="stat-value red">${biggestL > 0 ? "-$" + Math.round(biggestL).toLocaleString() : "—"}</div></div>
            <div class="stat-card"><div class="stat-label">Chains</div><div class="stat-value amber">${chainsVisited.length}</div></div>
          </div>
          <div class="chains-section">
            <div class="chains-label">Chain stamps</div>
            <div class="chains">
              ${CHAIN_STAMPS.map(c => `<span class="chain ${chainsVisited.includes(c) ? "active" : "inactive"}">${CHAIN_LABELS[c]}</span>`).join("")}
            </div>
          </div>
          <button class="share-btn" onclick="sharePassport('${handle}', '${rank}')">Share on X</button>
        </div>
      </div>
    `;
  } catch(err) {
    out.innerHTML = `<div class="error">${err.message || "Something went wrong. Check your API key and wallet address."}</div>`;
  } finally {
    btn.disabled = false;
  }
}

function sharePassport(handle, rank) {
  const tag = handle ? `@${handle}` : "my wallet";
  const text = encodeURIComponent(`Just got my Degen Passport — ranked ${rank} 🛂\n\nCheck yours 👇 #Web3 #Degen #DegenPassport`);
  window.open(`https://twitter.com/intent/tweet?text=${text}`, "_blank");
}
</script>
</body>
</html>
